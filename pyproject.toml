[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipador"
version = "0.1.0"
description = "Transforma videos longos em cortes verticais para TikTok, escolhidos por IA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "faster-whisper",
    "numpy",
    "rich",
    "pillow",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]
# Whisper na placa NVIDIA (CUDA 12): DLLs do cuBLAS/cuDNN. Sem isso ele roda na CPU (bem mais lento).
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
clipador = "clipador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# fontes do titulo e do credito (licenca OFL, junto dos arquivos)
"clipador.render" = ["fontes/*.ttf", "fontes/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
